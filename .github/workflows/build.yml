name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK parts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Unzip project
        run: |
          test -f amlastan.zip || { echo "amlastan.zip was not uploaded to the repository root"; exit 1; }
          unzip -q amlastan.zip

      - name: Build
        run: cd amlastan && gradle assembleDebug --no-daemon

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp amlastan/app/build/outputs/apk/debug/app-debug.apk amlastan.apk
          gh release create "amlastan-${{ github.run_number }}" amlastan.apk --repo "${{ github.repository }}" --title "املای من" --notes "فایل amlastan.apk را دانلود و نصب کنید."
